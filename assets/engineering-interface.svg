<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Evan Ketchum — Systems Engineering</title>
<desc id="desc">A dark, dimensional systems visualization with a luminous central intelligence node and interconnected engineering layers.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050914"/><stop offset=".55" stop-color="#09182a"/><stop offset="1" stop-color="#080b18"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#35e7ff" stop-opacity=".05"/><stop offset=".5" stop-color="#35e7ff" stop-opacity=".9"/><stop offset="1" stop-color="#8b78ff" stop-opacity=".25"/></linearGradient>
