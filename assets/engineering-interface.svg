 <text x="94" y="310" fill="#d7eaff" font-size="25">AI Systems  /  Engineering Intelligence</text>
 <text x="94" y="350" fill="#d7eaff" font-size="25">Computational Research  /  Human-Governed Architecture</text>
 <text x="94" y="438" fill="#83a9c9" font-size="14" letter-spacing="4">DESIGN  •  BUILD  •  TEST  •  VERIFY  •  PRESERVE</text>
 <text x="1490" y="480" fill="#5c7da8" font-size="12" text-anchor="end" letter-spacing="3">EK // SYSTEMS PORTFOLIO</text>
</g>
<path d="M0 504H1600" stroke="url(#neon)" stroke-width="2" opacity=".7"/>
</svg>