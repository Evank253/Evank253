<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
<title id="title">Evan Ketchum | Independent Systems Engineering</title>
<desc id="desc">Futuristic dark engineering portfolio interface with a luminous intelligence core, orbiting system nodes, circuit traces, and neon cyan and violet details.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030712"/><stop offset=".55" stop-color="#09172b"/><stop offset="1" stop-color="#160b2b"/></linearGradient>
 <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#37f3ff"/><stop offset=".52" stop-color="#5d9bff"/><stop offset="1" stop-color="#c06bff"/></linearGradient>
 <radialGradient id="core"><stop stop-color="#d6ffff"/><stop offset=".15" stop-color="#39eaff"/><stop offset=".48" stop-color="#227ac0" stop-opacity=".65"/><stop offset="1" stop-color="#227ac0" stop-opacity="0"/></radialGradient>
 <radialGradient id="halo"><stop stop-color="#38dfff" stop-opacity=".2"/><stop offset="1" stop-color="#38dfff" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#86baff" stroke-opacity=".08"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1600" height="520" rx="26" fill="url(#bg)"/><rect width="1600" height="520" rx="26" fill="url(#grid)"/>
<circle cx="1250" cy="255" r="390" fill="url(#halo)"/>
<g fill="none" stroke="url(#neon)" opacity=".68">
 <path d="M890 260H1040L1100 200H1170M1340 260H1480L1530 210" stroke-width="2"/>
 <path d="M1240 105V52H1400M1240 405V468H1450M1105 350H1030L980 400H900" stroke-width="1.6"/>
 <path d="M1130 130L1060 70H990M1370 145L1460 85M1370 365L1460 420" stroke-width="1.5"/>
</g>
<g fill="#61edff"><circle cx="1040" cy="260" r="5"/><circle cx="1170" cy="200" r="4"/><circle cx="1400" cy="52" r="4"/><circle cx="1030" cy="350" r="4"/><circle cx="1480" cy="260" r="4"/></g>
<g transform="translate(1240 260)">
 <circle r="184" fill="none" stroke="#50e6ff" stroke-opacity=".15" stroke-width="1"/>
 <circle r="150" fill="none" stroke="url(#neon)" stroke-opacity=".7" stroke-dasharray="4 12" stroke-width="2"/>
 <circle r="115" fill="none" stroke="#66dfff" stroke-opacity=".4"/>
 <circle r="82" fill="none" stroke="#bd7cff" stroke-opacity=".55" stroke-dasharray="2 7"/>
 <circle r="70" fill="url(#core)" filter="url(#glow)"/>
 <circle r="27" fill="#061521" stroke="#8af7ff" stroke-width="2" filter="url(#glow)"/>
 <circle r="8" fill="#efffff"/>
 <g fill="#071626" stroke="#6eeaff" stroke-width="2"><circle cx="0" cy="-150" r="8"/><circle cx="150" cy="0" r="8"/><circle cx="0" cy="150" r="8"/><circle cx="-150" cy="0" r="8"/><circle cx="106" cy="-106" r="6"/><circle cx="-106" cy="106" r="6"/></g>
</g>
<g font-family="Arial,Helvetica,sans-serif">
 <text x="92" y="112" fill="#75efff" font-size="17" letter-spacing="6">INDEPENDENT SYSTEMS ENGINEERING</text>
 <text x="86" y="218" fill="#f2f7ff" font-size="78" font-weight="700" letter-spacing="-2">EVAN KETCHUM</text>
