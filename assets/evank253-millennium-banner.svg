 <linearGradient id="cyan" x2="1"><stop stop-color="#13bce9"/><stop offset=".5" stop-color="#8beeff"/><stop offset="1" stop-color="#6475ff"/></linearGradient>
 <linearGradient id="violet" x2="1"><stop stop-color="#6f5cff"/><stop offset="1" stop-color="#d18aff"/></linearGradient>
 <linearGradient id="green" x2="1"><stop stop-color="#12b98b"/><stop offset="1" stop-color="#a2ff9b"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#39dfff" stop-opacity=".45"/><stop offset="1" stop-color="#39dfff" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#55bde9" stroke-opacity=".10"/></pattern>
 <filter id="blur"><feGaussianBlur stdDeviation="9"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<rect width="1200" height="420" rx="22" fill="url(#bg)"/><rect width="1200" height="420" rx="22" fill="url(#grid)"/>
