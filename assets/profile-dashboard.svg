<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Evan Ketchum systems portfolio dashboard</title>
<desc id="desc">Animated network of research and engineering domains with a qualitative portfolio focus meter and decorative activity waveform.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#040914"/><stop offset=".55" stop-color="#0a1730"/><stop offset="1" stop-color="#190d2c"/></linearGradient>
 <linearGradient id="cyan" x2="1"><stop stop-color="#35f1ff"/><stop offset="1" stop-color="#647dff"/></linearGradient>
 <linearGradient id="violet" x2="1"><stop stop-color="#7b73ff"/><stop offset="1" stop-color="#d26bff"/></linearGradient>
 <radialGradient id="core"><stop stop-color="#e5ffff"/><stop offset=".2" stop-color="#42eaff"/><stop offset="1" stop-color="#1a75bb" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#9bc9ff" stroke-opacity=".08"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="680" rx="24" fill="url(#bg)"/><rect width="1200" height="680" rx="24" fill="url(#grid)"/>
<text x="48" y="55" fill="#68eaff" font-family="Arial" font-size="14" letter-spacing="4">EK // INTELLIGENCE COMMAND CENTER</text>
<text x="48" y="96" fill="#f1f7ff" font-family="Arial" font-size="28" font-weight="bold">SYSTEMS LANDSCAPE</text>
<text x="1145" y="55" text-anchor="end" fill="#87a5ca" font-family="Arial" font-size="12" letter-spacing="2">PORTFOLIO VIEW / 01</text>
<!-- connector mesh -->
<g stroke="#48dff8" stroke-opacity=".36" stroke-width="2" fill="none">
 <path d="M600 310L230 210M600 310L970 210M600 310L230 420M600 310L970 420M600 310L600 520"/>
 <path d="M230 210L970 210M230 420L970 420" stroke-dasharray="4 9"/>
</g>
<g fill="#61eaff" filter="url(#glow)"><circle cx="415" cy="260" r="3"/><circle cx="785" cy="260" r="3"/><circle cx="415" cy="365" r="3"/><circle cx="785" cy="365" r="3"/></g>
<!-- central core -->
<g transform="translate(600 310)">
 <circle r="140" fill="none" stroke="#3eddf8" stroke-opacity=".22" stroke-dasharray="3 10"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="55s" repeatCount="indefinite"/></circle>
 <circle r="112" fill="none" stroke="url(#cyan)" stroke-opacity=".7" stroke-width="2" stroke-dasharray="7 10"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="32s" repeatCount="indefinite"/></circle>
 <circle r="85" fill="#091c34" stroke="#69eaff" stroke-width="2" filter="url(#glow)"/>
 <circle r="66" fill="url(#core)"><animate attributeName="r" values="60;70;60" dur="4s" repeatCount="indefinite"/></circle>
 <circle r="24" fill="#071625" stroke="#a0f6ff" stroke-width="2" filter="url(#glow)"/>
 <circle r="7" fill="#fff"/>
</g>
<g font-family="Arial" text-anchor="middle">
 <text x="600" y="303" fill="#f5fcff" font-size="19" font-weight="bold">SYSTEMS</text>
 <text x="600" y="327" fill="#83edff" font-size="12" letter-spacing="2">INTEGRATION</text>
</g>
<!-- orbit bubbles -->
<g font-family="Arial" text-anchor="middle">
 <g><circle cx="230" cy="210" r="68" fill="#0b2038" stroke="#3de6ff" stroke-width="2" filter="url(#glow)"><animate attributeName="r" values="65;69;65" dur="5s" repeatCount="indefinite"/></circle><circle cx="230" cy="210" r="55" fill="none" stroke="#3de6ff" stroke-opacity=".45"/><text x="230" y="205" fill="#eafaff" font-size="20" font-weight="bold">KCN</text><text x="230" y="229" fill="#7eeaff" font-size="11">GOVERNED AI</text></g>
 <g><circle cx="970" cy="210" r="68" fill="#171633" stroke="#b77aff" stroke-width="2" filter="url(#glow)"><animate attributeName="r" values="68;64;68" dur="6s" repeatCount="indefinite"/></circle><circle cx="970" cy="210" r="55" fill="none" stroke="#b77aff" stroke-opacity=".45"/><text x="970" y="205" fill="#f8efff" font-size="18" font-weight="bold">MANIFEX</text><text x="970" y="229" fill="#cda6ff" font-size="11">ENGINEERING OS</text></g>
 <g><circle cx="230" cy="420" r="68" fill="#0d2031" stroke="#55baff" stroke-width="2" filter="url(#glow)"><animate attributeName="r" values="68;64;68" dur="5.5s" repeatCount="indefinite"/></circle><circle cx="230" cy="420" r="55" fill="none" stroke="#55baff" stroke-opacity=".4"/><text x="230" y="415" fill="#eff9ff" font-size="18" font-weight="bold">GENESIS</text><text x="230" y="439" fill="#8ed2ff" font-size="11">DATA LINEAGE</text></g>
 <g><circle cx="970" cy="420" r="68" fill="#171a35" stroke="#9b8aff" stroke-width="2" filter="url(#glow)"><animate attributeName="r" values="64;68;64" dur="5.8s" repeatCount="indefinite"/></circle><circle cx="970" cy="420" r="55" fill="none" stroke="#9b8aff" stroke-opacity=".4"/><text x="970" y="415" fill="#f4f0ff" font-size="18" font-weight="bold">SCIENCE</text><text x="970" y="439" fill="#b9aaff" font-size="11">COMPUTATION</text></g>
 <g><circle cx="600" cy="520" r="56" fill="#10272c" stroke="#62e9c4" stroke-width="2" filter="url(#glow)"><animate attributeName="r" values="54;58;54" dur="4.5s" repeatCount="indefinite"/></circle><circle cx="600" cy="520" r="44" fill="none" stroke="#62e9c4" stroke-opacity=".4"/><text x="600" y="516" fill="#eafff7" font-size="15" font-weight="bold">ASSURANCE</text><text x="600" y="536" fill="#8cf5d6" font-size="10">EVIDENCE</text></g>
</g>
<!-- lower meter -->
<rect x="48" y="595" width="1104" height="58" rx="12" fill="#091528" stroke="#294b70"/>
<text x="68" y="619" fill="#9fc4e8" font-family="Arial" font-size="11" letter-spacing="2">PORTFOLIO FOCUS AREAS</text>
<g transform="translate(68 637)" font-family="Arial" font-size="10">
 <text x="0" y="0" fill="#6feaff">GOVERNANCE</text><rect x="100" y="-9" width="105" height="7" rx="3" fill="#1d3450"/><rect x="100" y="-9" width="96" height="7" rx="3" fill="url(#cyan)"/>
 <text x="230" y="0" fill="#b7a5ff">ENGINEERING</text><rect x="325" y="-9" width="105" height="7" rx="3" fill="#1d3450"/><rect x="325" y="-9" width="100" height="7" rx="3" fill="url(#violet)"/>
 <text x="455" y="0" fill="#6feaff">EVIDENCE</text><rect x="525" y="-9" width="105" height="7" rx="3" fill="#1d3450"/><rect x="525" y="-9" width="90" height="7" rx="3" fill="url(#cyan)"/>
 <text x="655" y="0" fill="#b7a5ff">RESEARCH</text><rect x="725" y="-9" width="105" height="7" rx="3" fill="#1d3450"/><rect x="725" y="-9" width="94" height="7" rx="3" fill="url(#violet)"/>
 <text x="855" y="0" fill="#6feaff">INTEGRATION</text><rect x="945" y="-9" width="105" height="7" rx="3" fill="#1d3450"/><rect x="945" y="-9" width="98" height="7" rx="3" fill="url(#cyan)"/>
</g>
</svg>